name: test

on:
  push:
  pull_request:

jobs:
  addon:
    name: Build the addon and run the tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The JavaScript SDK release that carries the persisted queue, origins,
      # signing and device fields.
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ravensight-c3addon
          path: dist/*.c3addon
